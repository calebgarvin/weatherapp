<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Charlotte Weather — 28215</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg:        #F5F0E8;
    --surface:   #EDEAE0;
    --border:    #D8D2C4;
    --text:      #2A2A2A;
    --sub:       #6B6560;
    --accent:    #3D3D3D;
    --toggle-bg: #C8C2B4;
  }
  [data-theme="dark"] {
    --bg:        #1E1E1E;
    --surface:   #272727;
    --border:    #383838;
    --text:      #E8E3DA;
    --sub:       #8A857C;
    --accent:    #C8C2B4;
    --toggle-bg: #444;
  }

  /* Temperature color scale */
  .temp-bar { height: 6px; border-radius: 3px; }
  .tc-arctic  { background: #2E86C1; }
  .tc-cold    { background: #5DADE2; }
  .tc-cool    { background: #7FB3D3; }
  .tc-mild    { background: #82C98A; }
  .tc-warm    { background: #F0B429; }
  .tc-hot     { background: #E8703A; }
  .tc-extreme { background: #C0392B; }

  /* Precip bar */
  .precip-fill { height: 6px; border-radius: 3px; background: #5B9BD5; }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    transition: background .3s, color .3s;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  /* ── Header ── */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    letter-spacing: -.5px;
    color: var(--text);
  }
  .brand span { font-style: italic; color: var(--sub); }
  .header-right { display: flex; align-items: center; gap: 20px; }
  #last-updated { font-size: .72rem; color: var(--sub); letter-spacing: .04em; }
  #refresh-btn {
    background: none; border: 1px solid var(--border);
    color: var(--sub); font-family: 'DM Mono', monospace;
    font-size: .72rem; padding: 5px 12px; border-radius: 4px;
    cursor: pointer; transition: all .2s;
    letter-spacing: .04em;
  }
  #refresh-btn:hover { color: var(--text); border-color: var(--text); }

  /* ── Toggle ── */
  .toggle-wrap { display: flex; align-items: center; gap: 8px; }
  .toggle-label { font-size: .7rem; color: var(--sub); letter-spacing: .06em; text-transform: uppercase; }
  .toggle {
    width: 40px; height: 22px; background: var(--toggle-bg);
    border-radius: 11px; position: relative; cursor: pointer;
    border: none; transition: background .3s;
  }
  .toggle::after {
    content: '';
    position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px;
    background: var(--text); border-radius: 50%;
    transition: transform .25s, background .3s;
  }
  [data-theme="dark"] .toggle::after { transform: translateX(18px); }

  /* ── Main layout ── */
  main { max-width: 1100px; margin: 0 auto; padding: 40px 40px 0; }

  /* ── Hero ── */
  .hero {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .hero-left {
    padding: 44px 44px 36px;
    border-right: 1px solid var(--border);
  }
  .hero-period {
    font-size: .7rem; letter-spacing: .12em;
    text-transform: uppercase; color: var(--sub);
    margin-bottom: 12px;
  }
  .hero-temp {
    font-family: 'DM Serif Display', serif;
    font-size: 6rem; line-height: 1;
    letter-spacing: -3px;
    margin-bottom: 8px;
  }
  .hero-temp-bar { width: 80px; margin: 14px 0 20px; }
  .hero-short {
    font-size: 1rem; color: var(--sub);
    font-weight: 300; line-height: 1.5;
    max-width: 320px;
  }
  .hero-right {
    padding: 44px 44px 36px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .hero-detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    flex: 1;
  }
  .detail-cell { display: flex; flex-direction: column; gap: 6px; }
  .detail-label {
    font-size: .65rem; letter-spacing: .1em;
    text-transform: uppercase; color: var(--sub);
  }
  .detail-value { font-size: 1.3rem; font-weight: 500; }
  .detail-bar { margin-top: 4px; }

  /* ── Section header ── */
  .section-label {
    font-size: .65rem; letter-spacing: .14em;
    text-transform: uppercase; color: var(--sub);
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  /* ── 7-day strip ── */
  .seven-day {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .day-card {
    background: var(--surface);
    padding: 20px 14px;
    display: flex; flex-direction: column;
    align-items: center; gap: 10px;
    transition: background .2s;
    cursor: default;
  }
  .day-card:hover { background: var(--bg); }
  .day-name { font-size: .65rem; letter-spacing: .1em; text-transform: uppercase; color: var(--sub); }
  .day-temp { font-family: 'DM Serif Display', serif; font-size: 1.5rem; }
  .day-bar { width: 36px; }
  .day-short { font-size: .65rem; color: var(--sub); text-align: center; line-height: 1.4; }
  .day-precip { font-size: .65rem; color: #5B9BD5; }

  /* ── Hourly scroll ── */
  .hourly-wrap {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .hourly-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  .hourly-scroll {
    overflow-x: auto;
    padding: 20px 24px;
    display: flex; gap: 20px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .hour-card {
    flex: 0 0 80px;
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
  }
  .hour-time { font-size: .6rem; letter-spacing: .08em; color: var(--sub); text-transform: uppercase; }
  .hour-temp { font-size: 1rem; font-weight: 500; }
  .hour-bar { width: 28px; }
  .hour-precip { font-size: .6rem; color: #5B9BD5; }
  .hour-wind { font-size: .6rem; color: var(--sub); text-align: center; }

  /* ── Loading / error ── */
  .loading-state {
    display: flex; align-items: center; justify-content: center;
    height: 300px; color: var(--sub);
    font-size: .85rem; letter-spacing: .06em;
    flex-direction: column; gap: 12px;
  }
  .spinner {
    width: 28px; height: 28px;
    border: 2px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-state {
    background: #fff0f0; border: 1px solid #e8b4b4;
    border-radius: 8px; padding: 20px 24px;
    color: #922; font-size: .8rem; line-height: 1.6;
  }
  [data-theme="dark"] .error-state { background: #2a1a1a; border-color: #5a2a2a; color: #e88; }

  @media (max-width: 800px) {
    header { padding: 20px; }
    main { padding: 24px 20px 0; }
    .hero { grid-template-columns: 1fr; }
    .hero-left { border-right: none; border-bottom: 1px solid var(--border); }
    .seven-day { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="brand">Charlotte <span>/ 28215</span></div>
  <div class="header-right">
    <span id="last-updated">—</span>
    <button id="refresh-btn" onclick="loadWeather()">↺ refresh</button>
    <div class="toggle-wrap">
      <span class="toggle-label">Dark</span>
      <button class="toggle" id="theme-toggle" aria-label="Toggle dark mode" onclick="toggleTheme()"></button>
    </div>
  </div>
</header>

<main id="main">
  <div class="loading-state">
    <div class="spinner"></div>
    <span>Fetching forecast...</span>
  </div>
</main>

<script>
// ── Coordinates for ZIP 28215 (Charlotte, NC) ──
const LAT = 35.2441;
const LON = -80.7487;
const UA  = '(28215WeatherApp, contact@example.com)';

// ── Theme ──
function getPreferredTheme() {
  const saved = localStorage.getItem('theme');
  if (saved) return saved;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
applyTheme(getPreferredTheme());

// ── Temperature color ──
function tempClass(f) {
  if (f === null || f === undefined) return '';
  if (f <= 20)  return 'tc-arctic';
  if (f <= 35)  return 'tc-cold';
  if (f <= 50)  return 'tc-cool';
  if (f <= 65)  return 'tc-mild';
  if (f <= 80)  return 'tc-warm';
  if (f <= 95)  return 'tc-hot';
  return 'tc-extreme';
}

// ── Precip bar width ──
function precipWidth(pct) {
  return Math.max(0, Math.min(100, pct || 0));
}

// ── Wind direction arrow ──
function windDir(deg) {
  if (deg === null || deg === undefined) return '';
  const dirs = ['N','NE','E','SE','S','SW','W','NW'];
  return dirs[Math.round(deg / 45) % 8];
}

// ── Format time to 12hr ──
function fmt12(isoStr) {
  const d = new Date(isoStr);
  let h = d.getHours();
  const ampm = h >= 12 ? 'pm' : 'am';
  h = h % 12 || 12;
  return `${h}${ampm}`;
}

// ── Day name ──
function dayName(isoStr, short = true) {
  const d = new Date(isoStr);
  return d.toLocaleDateString('en-US', { weekday: short ? 'short' : 'long' });
}

// ── Main fetch ──
async function loadWeather() {
  const main = document.getElementById('main');
  main.innerHTML = `<div class="loading-state"><div class="spinner"></div><span>Fetching forecast...</span></div>`;

  try {
    // Step 1: resolve grid
    const ptRes = await fetch(`https://api.weather.gov/points/${LAT},${LON}`, {
      headers: { 'User-Agent': UA }
    });
    if (!ptRes.ok) throw new Error(`Points API error: ${ptRes.status}`);
    const pt = await ptRes.json();
    const { forecast: forecastUrl, forecastHourly: hourlyUrl } = pt.properties;

    // Step 2: fetch daily + hourly in parallel
    const [dayRes, hrRes] = await Promise.all([
      fetch(forecastUrl, { headers: { 'User-Agent': UA } }),
      fetch(hourlyUrl,   { headers: { 'User-Agent': UA } })
    ]);
    if (!dayRes.ok) throw new Error(`Forecast error: ${dayRes.status}`);
    if (!hrRes.ok)  throw new Error(`Hourly error: ${hrRes.status}`);

    const dayData = await dayRes.json();
    const hrData  = await hrRes.json();

    render(dayData.properties.periods, hrData.properties.periods);
    document.getElementById('last-updated').textContent =
      'Updated ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

  } catch (err) {
    main.innerHTML = `<div class="error-state">
      <strong>Could not load forecast.</strong><br/>
      ${err.message}<br/><br/>
      The NWS API occasionally has brief outages. Try refreshing in a moment.
    </div>`;
  }
}

// ── Render ──
function render(daily, hourly) {
  const main = document.getElementById('main');

  // Hero = first period (today / tonight)
  const hero = daily[0];
  const heroNext = daily[1]; // to show today high + tonight low if needed

  // Determine if we have a daytime period first
  const isDay = hero.isDaytime;
  const heroTemp = hero.temperature;

  // Build hero detail stats from hourly
  const now = hourly[0];
  const wind = now.windSpeed || '';
  const windDeg = now.windDirection || '';
  const humidity = now.relativeHumidity?.value ?? null;
  const uvIndex = now.uvIndex ?? null;
  const precip = now.probabilityOfPrecipitation?.value ?? 0;

  // ── Hero HTML ──
  const heroHTML = `
  <div class="hero">
    <div class="hero-left">
      <div class="hero-period">${hero.name}</div>
      <div class="hero-temp">${heroTemp}°</div>
      <div class="hero-temp-bar">
        <div class="temp-bar ${tempClass(heroTemp)}"></div>
      </div>
      <div class="hero-short">${hero.detailedForecast}</div>
    </div>
    <div class="hero-right">
      <div class="hero-detail-grid">
        <div class="detail-cell">
          <div class="detail-label">Wind</div>
          <div class="detail-value">${hero.windSpeed}</div>
          <div style="font-size:.7rem;color:var(--sub)">${hero.windDirection}</div>
        </div>
        <div class="detail-cell">
          <div class="detail-label">Humidity</div>
          <div class="detail-value">${humidity !== null ? humidity + '%' : '—'}</div>
          ${humidity !== null ? `
          <div class="detail-bar">
            <div style="height:6px;border-radius:3px;background:var(--border);width:100%">
              <div style="height:6px;border-radius:3px;background:#5B9BD5;width:${humidity}%"></div>
            </div>
          </div>` : ''}
        </div>
        <div class="detail-cell">
          <div class="detail-label">UV Index</div>
          <div class="detail-value">${uvIndex !== null ? uvIndex : '—'}</div>
          ${uvIndex !== null ? `
          <div class="detail-bar">
            <div style="height:6px;border-radius:3px;background:var(--border);width:100%">
              <div style="height:6px;border-radius:3px;background:${uvIndex<=2?'#82C98A':uvIndex<=5?'#F0B429':uvIndex<=7?'#E8703A':'#C0392B'};width:${Math.min(uvIndex/11*100,100)}%"></div>
            </div>
          </div>` : ''}
        </div>
        <div class="detail-cell">
          <div class="detail-label">Precip Chance</div>
          <div class="detail-value">${hero.probabilityOfPrecipitation?.value ?? 0}%</div>
          <div class="detail-bar">
            <div style="height:6px;border-radius:3px;background:var(--border);width:100%">
              <div class="precip-fill" style="width:${precipWidth(hero.probabilityOfPrecipitation?.value)}%"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  // ── 7-day: group into day pairs (day/night), take 7 daytime periods ──
  const dayPeriods = daily.filter(p => p.isDaytime).slice(0, 7);
  const sevenHTML = `
  <div class="section-label">7-Day Outlook</div>
  <div class="seven-day">
    ${dayPeriods.map(p => `
    <div class="day-card">
      <div class="day-name">${p.name.length > 4 ? p.name.slice(0,3) : p.name}</div>
      <div class="day-temp">${p.temperature}°</div>
      <div class="day-bar">
        <div class="temp-bar ${tempClass(p.temperature)}"></div>
      </div>
      <div class="day-short">${p.shortForecast}</div>
      <div class="day-precip">💧 ${p.probabilityOfPrecipitation?.value ?? 0}%</div>
    </div>`).join('')}
  </div>`;

  // ── Hourly: next 24 hours ──
  const next24 = hourly.slice(0, 24);
  const hourlyHTML = `
  <div class="hourly-wrap">
    <div class="hourly-header">
      <div class="section-label" style="margin:0;border:none;padding:0">Hourly — Next 24 Hours</div>
    </div>
    <div class="hourly-scroll">
      ${next24.map(h => {
        const t = h.temperature;
        const p = h.probabilityOfPrecipitation?.value ?? 0;
        return `
        <div class="hour-card">
          <div class="hour-time">${fmt12(h.startTime)}</div>
          <div class="hour-temp">${t}°</div>
          <div class="hour-bar">
            <div class="temp-bar ${tempClass(t)}"></div>
          </div>
          <div class="hour-precip">💧 ${p}%</div>
          <div class="hour-wind">${h.windSpeed}<br/>${h.windDirection}</div>
        </div>`;
      }).join('')}
    </div>
  </div>`;

  main.innerHTML = heroHTML + sevenHTML + hourlyHTML;
}

// ── Init ──
loadWeather();

// ── OS theme change listener ──
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (!localStorage.getItem('theme')) applyTheme(e.matches ? 'dark' : 'light');
});
</script>
</body>
</html>
